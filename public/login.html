<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Вход, склад закупок</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif+Caption&display=swap">
<style>
:root{--bg:#F5F4F9;--surface:#FFFFFF;--ink:#1D1B2B;--muted:#67647C;--line:#E1DFEC;--accent:#7A3FEF;--accent-ink:#FFFFFF;--hl:#FFEE56;--hl-ink:#1D1B2B;--bad:#B3261E;--bad-bg:#FCE4E2;
  --f-head:'PT Serif Caption','PT Serif',Georgia,serif;--f-body:'PT Sans',system-ui,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14121C;--surface:#1E1B2A;--ink:#ECE9F7;--muted:#9E9AB5;--line:#34304A;--accent:#A98BFF;--accent-ink:#14121C;--bad:#FF8F86;--bad-bg:#3D1A18;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px}
h1{font:700 24px/1.15 var(--f-head);margin:0 0 4px}
.mark{display:inline-block;background:var(--hl);color:var(--hl-ink);padding:0 8px;border-radius:3px}
p{margin:0 0 16px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);margin-bottom:12px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{width:100%;font:700 15px var(--f-body);border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;cursor:pointer}
button:disabled{opacity:.6}
.err{background:var(--bad-bg);color:var(--bad);padding:9px 12px;border-radius:4px;margin-bottom:12px}
</style></head><body>
<main>
  <h1><span class="mark">Склад</span> закупок</h1>
  <p>ОЦ «Одаренный ребенок». Войдите, чтобы продолжить.</p>
  <div id="err" class="err" hidden role="alert"></div>
  <form id="f">
    <label>Логин<input id="login" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
    <button id="go" type="submit">Войти</button>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'),go=document.getElementById('go');
  err.hidden=true;go.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'sklad'},
      body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('pw').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location.href='/';return}
    err.textContent=j.error||'Не удалось войти';err.hidden=false;
  }catch(x){err.textContent='Нет связи с сервером';err.hidden=false}
  go.disabled=false;
});
</script>
</body></html>
